# M13.7 — themes are swappable files from day one.
name = "default"
banner = "./assets/banner.ans"

[colors]
accent      = "#FFE6CB"
success     = "#4ADE80"
warning     = "#FFBD38"
danger      = "#FF4B4B"   # integrity alerts ONLY — reserve it, use it nowhere else
muted       = "#A79F8E"
background  = "#041C1C"

[spinner]
style  = "braille"
frames = ["⠋","⠙","⠹","⠸","⠼","⠴","⠦","⠧","⠇","⠏"]
