# Ruff (bug rules) and the whole suite, in parallel, on Windows, Ubuntu and
# macOS, Python 3.11. First green 2026-10-28 (bermuda-xrs/bucephalus#2); that
# was the first time darwin.py ran anywhere, and it needed fixes.
#
# Not covered here:
#   * The live-credential tests skip without secrets, by design (D26).
#   * The frozen gate (packaging/build.py --probe) is not run: it is a
#     separate ~4 minute build per OS.
#   * The runners are VMs: bare-metal Linux and the docs/PLATFORMS.md
#     checklist on a Mac are still unrun.
name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history: test_handover_is_current checks that the commit
          # docs/HANDOVER.md was verified against is an ancestor of HEAD, and a
          # depth-1 clone holds no commit but HEAD.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install ".[dev]"
      - name: Lint (bug rules only; see tool.ruff in pyproject.toml)
        run: python -m ruff check src tests scripts packaging demo.py
      - name: Test (parallel, as pyproject's addopts says)
        env:
          PYTHONUTF8: "1"
        run: python -m pytest -q
