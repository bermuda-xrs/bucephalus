db_path: "./agent.db"
anchor_path: "./anchor/chain.anchor"
skills_path: "./skills_store"

backends:
  cloud:
    kind: anthropic
    model: "claude-opus-5"          # spec said claude-sonnet-4-6; verified current
    input_cost_per_mtok: 5.00
    output_cost_per_mtok: 25.00
    cache_read_per_mtok: 0.50       # ~0.1x input
    cache_write_per_mtok: 6.25      # ~1.25x input, 5-minute TTL
    context_window: 1000000         # advertised maximum
    usable_context_window: 200000   # what M3.4 budgets against; see the ceiling note
    can_parallel: true
    trust_tier: cloud
    effort: "high"                  # low|medium|high|xhigh|max
    thinking: "adaptive"            # adaptive|disabled  (disabled only at effort<=high)
    accepts_temperature: false      # opus-5/sonnet-5 reject temperature with a 400
    max_output_tokens: 16000

  review:                            # M13.3 auto-review — MUST differ from the executor
    kind: anthropic
    model: "claude-sonnet-5"
    input_cost_per_mtok: 3.00
    output_cost_per_mtok: 15.00
    cache_read_per_mtok: 0.30
    cache_write_per_mtok: 3.75
    context_window: 1000000
    usable_context_window: 200000
    can_parallel: true
    trust_tier: cloud
    effort: "low"                   # narrow job, no need to burn tokens
    thinking: "adaptive"
    accepts_temperature: false
    max_output_tokens: 2048

  # ---------------------------------------------------------------------
  # Local tiers. Both are Granite 4.1 — ONE family, so one chat template,
  # one tool-call syntax, one set of failure modes across both machines.
  # That is what spec 0.1 actually asks for.
  #
  # The spec named muse-glimmer:30b here and muse-glimmer:3b for the laptop.
  # Neither is usable:
  #   * Muse Glimmer has no 3B. All 15 Ollama tags are 30B. The "3B assistant
  #     model" in the release notes is Muse-Glimmer-30B-assistant, a DFlash
  #     block-diffusion DRAFTER for speculative decoding — not a chat model,
  #     and it needs the 30B loaded beside it.
  #   * The smallest 30B quant is 17 GB. This machine has 15.5 GB RAM and a
  #     2 GB shared-memory Intel iGPU, which is spec 0.1's "no GPU" row.
  # Restore muse-glimmer:30b as `local` if you move to a 24-32 GB GPU box.
  # ---------------------------------------------------------------------

  local:                            # desktop tier
    kind: ollama
    model: "granite4.1:8b"          # 5.3 GB, Q4_K_M
    endpoint: "http://localhost:11435"
    input_cost_per_mtok: 0.0
    output_cost_per_mtok: 0.0
    cache_read_per_mtok: 0.0
    cache_write_per_mtok: 0.0
    context_window: 131072
    usable_context_window: 32768    # CPU inference: long prompts cost wall-clock
    can_parallel: false
    speculative_decoding: false     # no drafter ships with Granite
    thinking: "disabled"            # CPU-only here; see 0.1b
    accepts_temperature: true
    max_output_tokens: 2048
    trust_tier: local

  laptop:                           # constrained tier — time is the budget
    kind: ollama
    model: "granite4.1:3b"          # 2.1 GB, same family = same template
    endpoint: "http://localhost:11435"
    input_cost_per_mtok: 0.0
    output_cost_per_mtok: 0.0
    cache_read_per_mtok: 0.0
    cache_write_per_mtok: 0.0
    context_window: 131072
    usable_context_window: 16384
    can_parallel: false
    thinking: "disabled"            # OFF — output tokens are wall-clock here
    max_output_tokens: 1024         # hard cap against runaway generation
    accepts_temperature: true
    trust_tier: local

# Which local tier is live. Set from MEASUREMENT, not from the spec table:
# run `alpha bench-local` and read the observed tokens/sec per purpose.
active_local_tier: "local"          # local | laptop | null (null disables offload)

limits:
  context_fill_ratio: 0.28          # HARD CAP — see M3.4
  default_task_budget_usd: 0.50
  default_task_budget_seconds: 600
  max_refinement_iterations: 6
  max_steps: 24
  delegation_min_isolated_tokens: 1000

local_allowlist:                    # M6 — expand only with measurements
  - summarize
  - classify
  - extract
  - compress_tool_output
  - draft_candidate

laptop_allowlist:
  - classify
  - extract
  - compress_tool_output

# M3.3: observations larger than this get compressed by the local tier before
# entering the ledger. This is the call site that makes the local tier earn
# its keep — below it, compressing costs more wall-clock than it saves.
compress_observations_over_tokens: 1200

gate:
  min_paired_trials: 30
  min_lift_pp: 5.0
  max_p_value: 0.05
  min_discordant_pairs: 10

autonomy:                           # M13
  mode: "plan_then_run"             # plan_then_run | interactive | manual
  plan_required: true               # no execution without an approved plan
  auto_review: true                 # reviewer agent handles USER-tier boundaries
  auto_review_backend: "review"     # MUST differ from the executing backend
  auto_review_policy: "./policy.md"
  deviation_tolerance: 0.25         # replan if >25% of the plan is off-script
  human_only_tiers: ["trusted"]     # never auto-reviewed; always parks for you

ui:
  theme: "./themes/default.toml"
  banner_art: "./assets/banner.ans"
  background_image: "./assets/bg.png"    # web/desktop surfaces only
  background_opacity: 0.15
  spinner: "braille"
