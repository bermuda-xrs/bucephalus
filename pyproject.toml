[project]
name = "bucephalus"
version = "0.1.0"
description = "Hybrid local/cloud agent system with verified skill learning"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    "anthropic>=0.40",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "sympy==1.13.3",
  # A8 - the TUI. Python-only, no new runtime.
  "textual>=0.80",          # SANDBOX LIBRARY, pinned: model-written
                              # code imports it. See TOOLSET_VERSION -
                              # an unpinned version would let two runs
                              # import different code under one
                              # toolset version.
    "rich>=13.0",             # readable CLI output
    "platformdirs>=4.0",      # state paths once installed
]
# NOTE: the build spec listed `tiktoken` for token counting. It is deliberately
# omitted: tiktoken is OpenAI's tokenizer and undercounts Claude tokens by
# 15-20% on prose and far more on code. See src/agent/tokens.py.

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-xdist>=3.5", "pytest-cov>=5", "httpx>=0.27",
       "scipy>=1.13",   # only to check skills/gate.binom_greater against binomtest
       "ruff>=0.6"]     # CI lint, bug rules only (tool.ruff below)

[project.scripts]
bucephalus = "agent.cli:main"

[tool.ruff]
extend-exclude = ["tests/archive", "bench/archive", "build"]

[tool.ruff.lint]
# Bugs, not style: unused and undefined names, syntax and runtime errors.
# Unused imports hid in strings an AST scan counted as uses (2026-10-04).
select = ["F", "E9", "PLE"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# Runtime assets the agent reads. Without these an installed wheel starts and
# then fails on the first theme or banner lookup.
[tool.setuptools.package-data]
agent = ["themes/*.toml", "assets/*.ans", "control/*.html", "control/*.js", "control/*.css", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Parallel by default (iteration 3, 2.2). Tests that share a real resource
# say so with xdist_group; --dist loadgroup keeps each group on one worker.
# `-p no:xdist` or `-n 0` runs serially.
addopts = "-n auto --dist loadgroup"
filterwarnings = ["ignore::DeprecationWarning"]

# Editable installs (`pip install -e .`) fail when this project lives under a
# path containing non-ASCII characters on a machine whose ANSI codepage is not
# UTF-8: setuptools encodes its .pth file with the locale codec and raises
# UnicodeEncodeError. Hence `pythonpath` above and the bucephalus.cmd launcher —
# neither needs the package installed. See README, "Running it".
